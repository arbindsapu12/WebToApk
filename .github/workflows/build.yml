name: Build APK

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # ✅ IMPORTANT: install all dependencies
      - name: Install dependencies
        run: npm install

      # ✅ FIX: install capacitor properly
      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # ✅ init (ignore if already exists)
      - name: Init App
        run: npx cap init myapp com.myapp.app || true

      # ❌ REMOVE cap add (problem yahi hai)
      # ✅ USE sync instead
      - name: Sync Android
        run: npx cap sync android

      # (optional) build apk
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

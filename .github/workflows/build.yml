name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli

      - name: Init App
        run: |
          npx cap init myapp com.myapp.app --web-dir=.

      - name: Add Android
        run: |
          npx cap add android

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug
